<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JULESGAMBLES</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#07080e;--s1:#0c1020;--s2:#101828;--b1:rgba(255,255,255,.04);--b2:rgba(255,255,255,.08);--b3:rgba(255,255,255,.14);--tx:#dde3ef;--mu:rgba(221,227,239,.65);--ac:#a855f7;--gold:#d4af5a}
    html,body{background-color:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
    @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fu .5s ease both}.f2{animation:fu .5s .15s ease both}.f3{animation:fu .5s .3s ease both}

    nav{background:rgba(6,7,13,.97);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:50}
    .ni{max-width:1020px;margin:0 auto;padding:0 28px;display:flex;align-items:center;height:56px;position:relative}
    .nlogo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
    .nname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;color:#fff;text-transform:uppercase}
    .nlinks{display:flex;align-items:center;position:absolute;left:50%;transform:translateX(-50%)}
    .nlinks a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:0 13px;height:56px;display:flex;align-items:center;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;margin-bottom:-1px;cursor:pointer}
    .nlinks a:hover{color:rgba(255,255,255,.9)}
    .nlinks a.on{color:#fff;border-bottom-color:rgba(255,255,255,.5)}
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;margin-left:auto;padding:4px;background:none;border:none}
    .hamburger span{display:block;height:1.5px;background:rgba(255,255,255,.6);border-radius:2px}
    .drawer{display:none;flex-direction:column;background:rgba(6,7,13,.99);border-bottom:1px solid var(--b2);padding:10px 28px 18px}
    .drawer.open{display:flex}
    .drawer a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--b1);transition:color .15s;cursor:pointer}
    .drawer a:last-of-type{border-bottom:none}
    .drawer a.on,.drawer a:hover{color:#fff}
    @media(max-width:640px){.nlinks{display:none}.hamburger{display:flex}}

    .page{width:100%;max-width:1020px;margin:0 auto;padding:0 28px}

    /* Hero */
    .hero{position:relative;border-radius:16px;overflow:hidden;height:280px;margin:28px 0 32px;background:linear-gradient(135deg,#0d0a1a 0%,#1a0d2e 50%,#0d0a1a 100%);box-shadow:0 8px 48px rgba(0,0,0,.55);display:flex;align-items:center;padding:40px 52px}
    .hero-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(168,85,247,.15) 0%,transparent 60%);pointer-events:none}
    .hero-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
    .hero-title{font-family:'Barlow Condensed',sans-serif;font-size:58px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:.95;margin-bottom:14px}
    .hero-sub{font-size:14px;color:var(--mu);max-width:380px;line-height:1.6;margin-bottom:24px}
    .hero-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 22px;border-radius:8px;background:var(--ac);color:#fff;border:none;cursor:pointer;transition:opacity .15s;text-decoration:none}
    .hero-btn:hover{opacity:.85}

    /* Section */
    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .sec-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff}
    .sec-line{flex:1;height:1px;background:var(--b2)}

    /* Platform cards */
    .platforms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:48px}
    .pcard{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .15s}
    .pcard:hover{border-color:var(--b3);transform:translateY(-2px)}
    .pcard-top{display:flex;align-items:center;gap:14px}
    .pcard-logo{width:48px;height:48px;border-radius:10px;object-fit:contain;background:var(--s2);padding:6px}
    .pcard-info{flex:1}
    .pcard-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff}
    .pcard-code{font-size:11px;color:var(--mu);margin-top:2px}
    .pcard-code span{color:var(--ac);font-weight:600}
    .pcard-desc{font-size:13px;color:var(--mu);line-height:1.55}
    .pcard-btn{display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border-radius:8px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:var(--ac);cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none}
    .pcard-btn:hover{background:rgba(168,85,247,.2);border-color:rgba(168,85,247,.4)}

    /* Leaderboard tab */
    .lb-wrap{padding:32px 0 64px}
    .ptabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
    .ptab{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 20px;border-radius:8px;border:1px solid var(--b2);background:var(--s1);color:var(--mu);cursor:pointer;transition:all .15s}
    .ptab:hover{color:#fff;border-color:var(--b3)}
    .ptab.active{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.35);color:var(--ac)}

    /* Rewards tab */
    .rewards-wrap{padding:32px 0 64px}
    .rcard{background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:24px;margin-bottom:16px}
    .rcard-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-bottom:8px}
    .rcard-desc{font-size:13px;color:var(--mu);line-height:1.6}

    /* Leaderboard */
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
    .lb-header{text-align:center;padding:32px 0 8px}
    .lb-platform-logo{height:38px;object-fit:contain;margin-bottom:10px}
    .lb-prize-amt{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:800;line-height:1;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px}
    .lb-prize-dollar{color:#22c55e}
    .lb-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:6px}
    .lb-code{font-size:13px;color:var(--mu);margin-top:8px}
    .lb-code strong{color:#fff;letter-spacing:.06em}
    .lb-meta{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 20px;flex-wrap:wrap}
    .live-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;color:#22c55e}
    .live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pu 1.2s ease-in-out infinite}
    .lb-meta-item{font-size:12px;color:var(--mu)}
    .lb-meta-item strong{color:#fff}
    .lb-cta-row{display:flex;justify-content:center;gap:10px;margin-bottom:32px;flex-wrap:wrap}
    .lb-cta-btn{display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:12px 28px;border-radius:9px;text-decoration:none;transition:all .15s}
    .lb-cta-primary{background:#fff;color:#111;border:1px solid transparent}
    .lb-cta-primary:hover{background:rgba(255,255,255,.88)}
    .lb-cta-secondary{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
    .lb-cta-secondary:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35);color:#fff}
    .countdown{display:flex;justify-content:center;gap:8px;margin-bottom:36px;flex-wrap:wrap}
    .cd-unit{display:flex;flex-direction:column;align-items:center}
    .cd-num{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--b2);border-radius:8px;padding:6px 14px;min-width:54px;text-align:center;line-height:1}
    .cd-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:5px}
    .cd-sep{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:rgba(255,255,255,.2);padding-bottom:18px;align-self:flex-end}
    .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;margin-bottom:32px;align-items:end}
    .pcard{background:#1c1c1c;border:none;border-radius:12px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
    .pcard::before{content:'';position:absolute;inset:0;border-radius:12px;padding:1px;background:linear-gradient(to bottom,transparent 0%,rgba(255,255,255,.18) 70%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;pointer-events:none}
    .pcard.p1{padding:26px 22px 22px}
    .pcard.p1::before{background:linear-gradient(to bottom,transparent 0%,#c8840a 65%);padding:2px}
    .pcard.p3::before{background:linear-gradient(to bottom,transparent 0%,#7a3a10 65%);padding:2px}
    .pavatar-wrap{position:relative;margin-bottom:8px}
    .pavatar{width:80px;height:80px;border-radius:50%;background:#111;border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;overflow:hidden;object-fit:cover}
    .p1 .pavatar{width:104px;height:104px;border-color:#c8840a}
    .p3 .pavatar{border-color:#7a3a10}
    .prank-badge{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);min-width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:#fff;padding:0 7px}
    .p1 .prank-badge{background:#c8840a}
    .p2 .prank-badge{background:#525252}
    .p3 .prank-badge{background:#7a3a10}
    .puname{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#fff;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pstat-block{width:100%;background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden}
    .pstat-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px}
    .pstat-divider{width:100%;height:1px;background:rgba(255,255,255,.07)}
    .pstat-lbl{font-size:14px;font-weight:700;color:#fff}
    .pstat-lbl.muted{font-size:13px;font-weight:400;color:rgba(255,255,255,.45)}
    .pstat-val{display:flex;align-items:center;gap:3px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:#fff}
    .pstat-val.muted{color:rgba(255,255,255,.45)}
    .pstat-green{color:#22c55e}
    .sdiv{display:flex;align-items:center;gap:14px;margin:28px 0 18px}
    .sdl{flex:1;height:1px;background:var(--b2)}
    .sdlbl{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
    .lbtable{border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;margin-bottom:56px}
    .lbhead{display:grid;grid-template-columns:60px 1fr 160px 130px;align-items:center;padding:10px 20px;background:#1c1c1c;border-bottom:1px solid rgba(255,255,255,.07)}
    .lbh{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;justify-content:center}
    .lbrow{display:grid;grid-template-columns:60px 1fr 160px 130px;align-items:center;padding:14px 20px;background:#1c1c1c;border-bottom:1px solid rgba(255,255,255,.07);transition:background .15s}
    .lbrow:last-child{border-bottom:none}
    .lbrow:hover{background:#222}
    .lbrk{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--mu);display:flex;align-items:center;justify-content:center}
    .lbnm{font-size:13px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:center}
    .lbwager{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--mu);display:flex;align-items:center;justify-content:center;white-space:nowrap}
    .lbprize{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;white-space:nowrap;gap:2px}
    .lbprize-dollar{color:#22c55e}
    @media(max-width:600px){.podium{gap:8px}.cd-num{font-size:28px;padding:5px 10px;min-width:42px}}

    /* Coming soon */
    .coming-soon{text-align:center;padding:80px 20px;color:var(--mu)}
    .coming-soon-icon{font-size:48px;margin-bottom:16px}
    .coming-soon-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-bottom:8px}
    .coming-soon-sub{font-size:14px;color:var(--mu)}

    footer{border-top:1px solid var(--b1);padding:32px 28px;text-align:center;font-size:12px;color:rgba(221,227,239,.3);margin-top:auto}
  </style>
</head>
<body>
<script type="text/babel">
const { useState, useEffect } = React;

function Nav({ page, setPage, drawerOpen, setDrawerOpen }) {
  const links = [
    { id: 'home', label: 'Home' },
    { id: 'leaderboards', label: 'Leaderboards' },
    { id: 'rewards', label: 'Rewards' },
  ];
  return (
    <>
      <nav>
        <div className="ni">
          <a className="nlogo" onClick={() => setPage('home')} style={{cursor:'pointer'}}>
            <span className="nname">JulesGambles</span>
          </a>
          <div className="nlinks">
            {links.map(l => (
              <a key={l.id} className={page === l.id ? 'on' : ''} onClick={() => { setPage(l.id); setDrawerOpen(false); }}>
                {l.label}
              </a>
            ))}
          </div>
          <button className="hamburger" onClick={() => setDrawerOpen(o => !o)}>
            <span/><span/><span/>
          </button>
        </div>
      </nav>
      <div className={`drawer ${drawerOpen ? 'open' : ''}`}>
        {links.map(l => (
          <a key={l.id} className={page === l.id ? 'on' : ''} onClick={() => { setPage(l.id); setDrawerOpen(false); }}>
            {l.label}
          </a>
        ))}
      </div>
    </>
  );
}

function HomePage({ setPage }) {
  return (
    <div className="page">
      {/* Hero */}
      <div className="hero f1">
        <div className="hero-glow"/>
        <div style={{position:'relative',zIndex:1}}>
          <div className="hero-eyebrow">Welcome</div>
          <div className="hero-title">Jules<br/>Gambles</div>
          <div className="hero-sub">Exclusive leaderboards, rewards and more. Use code JULES on partnered platforms.</div>
          <a className="hero-btn" onClick={() => setPage('leaderboards')}>View Leaderboards</a>
        </div>
      </div>

      {/* Platforms */}
      <div className="f2">
        <div className="sec-head">
          <span className="sec-title">Partnered Platforms</span>
          <div className="sec-line"/>
        </div>
        <div className="platforms">
          <div className="pcard">
            <div className="pcard-top">
              <div style={{width:48,height:48,borderRadius:10,background:'var(--s2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>🎰</div>
              <div className="pcard-info">
                <div className="pcard-name">Coming Soon</div>
                <div className="pcard-code">Code: <span>JULES</span></div>
              </div>
            </div>
            <div className="pcard-desc">Partnered platforms will appear here. Check back soon.</div>
            <a className="pcard-btn">Learn More</a>
          </div>
        </div>
      </div>
    </div>
  );
}

function useCountdown(endDate) {
  const [t, setT] = useState(0);
  useEffect(() => {
    const tick = () => setT(Math.max(0, new Date(endDate) - Date.now()));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [endDate]);
  const s = Math.floor(t / 1000);
  return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
}

function Pad({ n }) { return String(n).padStart(2, '0'); }

function Avatar({ src, name, className }) {
  const [err, setErr] = useState(false);
  if (src && !err) return <img src={src} className={className} onError={() => setErr(true)} style={{borderRadius:'50%',objectFit:'cover'}}/>;
  return <div className={className}>{(name || '?')[0].toUpperCase()}</div>;
}

function GambaLeaderboard() {
  const [players, setPlayers] = useState([]);
  const [meta, setMeta] = useState({ endDate: null, prizePool: null });

  useEffect(() => {
    const load = async () => {
      try {
        const [p, m] = await Promise.all([
          fetch('/players').then(r => r.json()),
          fetch('/gamba-meta').then(r => r.json()),
        ]);
        setPlayers(Array.isArray(p) ? p : []);
        setMeta(m || {});
      } catch {}
    };
    load();
    const id = setInterval(load, 60000);
    return () => clearInterval(id);
  }, []);

  const cd = useCountdown(meta.endDate);
  const top3 = players.slice(0, 3);
  const rest = players.slice(3);
  const ended = meta.endDate && new Date(meta.endDate) < new Date();

  const fmtNum = v => Number(v || 0).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
  const fmtWager = v => `$${fmtNum(v)}`;
  const fmtPrize = v => `$${fmtNum(v)}`;

  const podiumOrder = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3;
  const podiumClass = top3.length === 3 ? ['p2', 'p1', 'p3'] : ['p1', 'p2', 'p3'];

  if (players.length === 0) return (
    <div className="coming-soon">
      <div className="coming-soon-icon">🏆</div>
      <div className="coming-soon-title">Loading...</div>
      <div className="coming-soon-sub">Fetching leaderboard data.</div>
    </div>
  );

  return (
    <div>
      <div className="lb-header">
        <img src="/assets/gamba.png" className="lb-platform-logo" alt="Gamba"/>
        <div className="lb-title">Bi-Weekly Leaderboard</div>
        <div className="lb-prize-amt">{meta.prizePool ? <><span className="lb-prize-dollar">$</span>{Number(meta.prizePool).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0})}</> : '—'}</div>
        <div className="lb-code">Use code <strong>JULES</strong> to qualify</div>
      </div>

      {top3.length > 0 && (
        <div className="podium">
          {podiumOrder.map((p, i) => {
            const rankNum = podiumClass[i] === 'p1' ? 1 : podiumClass[i] === 'p2' ? 2 : 3;
            return p ? (
              <div key={p.id} className={`pcard ${podiumClass[i]}`}>
                <div className="pavatar-wrap">
                  <Avatar src={p.avatar} name={p.username} className="pavatar"/>
                  <div className="prank-badge">{rankNum}</div>
                </div>
                <div className="puname">{p.username}</div>
                <div className="pstat-block">
                  <div className="pstat-row">
                    <span className="pstat-lbl">Prize</span>
                    <span className="pstat-val"><span className="pstat-green">$</span>{fmtNum(p.reward)}</span>
                  </div>
                  <div className="pstat-divider"/>
                  <div className="pstat-row">
                    <span className="pstat-lbl muted">Wagered</span>
                    <span className="pstat-val muted"><span>$</span>{fmtNum(p.wager)}</span>
                  </div>
                </div>
              </div>
            ) : <div key={i}/>;
          })}
        </div>
      )}

      {!ended && meta.endDate && (
        <div className="countdown">
          {[{v:cd.d,l:'Days'},{v:cd.h,l:'Hours'},{v:cd.m,l:'Mins'},{v:cd.s,l:'Secs'}].map((u,i,a) => (
            <React.Fragment key={u.l}>
              <div className="cd-unit">
                <div className="cd-num"><Pad n={u.v}/></div>
                <div className="cd-label">{u.l}</div>
              </div>
              {i < a.length - 1 && <div className="cd-sep">:</div>}
            </React.Fragment>
          ))}
        </div>
      )}

      <div className="lb-cta-row">
        <a href="https://gamba.com/promotions/exclusive-leaderboards/16798" target="_blank" rel="noreferrer" className="lb-cta-btn lb-cta-secondary">
          View Leaderboard on Gamba
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11}}><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        </a>
        <a href="https://gamba.com?c=jules" target="_blank" rel="noreferrer" className="lb-cta-btn lb-cta-primary">
          Sign Up on Gamba
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:11,height:11}}><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>

      {rest.length > 0 && (
        <>
          <div className="sdiv"><div className="sdl"/><span className="sdlbl">Remaining Places</span><div className="sdl"/></div>
          <div className="lbtable">
            <div className="lbhead">
              <span className="lbh">#</span>
              <span className="lbh">Username</span>
              <span className="lbh" style={{textAlign:'right'}}>Wagered</span>
              <span className="lbh" style={{textAlign:'right'}}>Prize</span>
            </div>
            {rest.map(p => (
              <div key={p.id} className="lbrow">
                <span className="lbrk">{p.position}</span>
                <span className="lbnm">{p.username}</span>
                <span className="lbwager">{fmtWager(p.wager)}</span>
                <span className="lbprize">{p.reward > 0 ? <><span className="lbprize-dollar">$</span>{fmtNum(p.reward)}</> : '-'}</span>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function LeaderboardsPage() {
  return (
    <div className="page">
      <div style={{paddingBottom:64}}>
        <GambaLeaderboard/>
      </div>
    </div>
  );
}

function RewardsPage() {
  return (
    <div className="page">
      <div className="rewards-wrap">
        <div className="coming-soon">
          <div className="coming-soon-icon">🎁</div>
          <div className="coming-soon-title">Coming Soon</div>
          <div className="coming-soon-sub">Rewards and bonuses will be listed here.</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const pathMap = { '/': 'home', '/leaderboards': 'leaderboards', '/rewards': 'rewards' };
  const [page, setPage] = useState(pathMap[window.location.pathname] || 'home');
  const [drawerOpen, setDrawerOpen] = useState(false);

  useEffect(() => {
    const titles = { home: 'JulesGambles', leaderboards: 'Leaderboards - JulesGambles', rewards: 'Rewards - JulesGambles' };
    document.title = titles[page] || 'JulesGambles';
    window.history.pushState({}, '', page === 'home' ? '/' : '/' + page);
  }, [page]);

  return (
    <>
      <Nav page={page} setPage={setPage} drawerOpen={drawerOpen} setDrawerOpen={setDrawerOpen}/>
      {page === 'home'         && <HomePage setPage={setPage}/>}
      {page === 'leaderboards' && <LeaderboardsPage/>}
      {page === 'rewards'      && <RewardsPage/>}
      <footer>© 2026 JulesGambles · All rights reserved</footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
